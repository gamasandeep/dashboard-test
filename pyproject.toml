[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-engine"
version = "0.1.0"
description = "03 · Content Engine of the AI Native Social Media Agent Team"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.16", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
content-engine = "content_engine.cli:main"

[tool.setuptools]
packages = ["content_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
